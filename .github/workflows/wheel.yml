# Release guide: .github/RELEASING.md; CUDA handoff: .github/CUDA_RELEASE.md.
# Keep this workflow filename/environment: PyPI Trusted Publishing uses them.
name: Build and release wheels

on:
  workflow_dispatch:
    inputs:
      cuda-model-path:
        description: Absolute CUDA export path on the Linux test runner (defaults to repository variable MUSE_GLIMMER_CUDA_MODEL_PATH)
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    # Coordination stays on the Mac for now; no GitHub-hosted runner is required.
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - id: plan
        run: python packaging/release.py plan

  mac:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'darwin-arm64')
    uses: ./.github/workflows/mac_wheel.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  linux:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.platforms), 'linux-x86_64-cuda-13_2')
    uses: ./.github/workflows/linux_wheel.yml
    with:
      model-path: ${{ inputs.cuda-model-path || vars.MUSE_GLIMMER_CUDA_MODEL_PATH }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  collect:
    # No platform is optional: missing/failed builds or tests block publication.
    needs: [plan, mac, linux]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: muse-glimmer-*
          path: artifacts
          merge-multiple: false
      - name: Verify the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release.py collect artifacts release --attest
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error

  publish:
    needs: collect
    # Override GitHub's implicit success(): disabled platforms are skipped ancestors.
    if: >-
      !cancelled() && needs.collect.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/muse-glimmer
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: release
      - name: Verify, attest and publish every wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv pip install pypi-attestations==0.0.31
          python packaging/release.py publish release

  verify-pypi:
    name: Verify published ${{ matrix.platform }}
    needs: [plan, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.publish.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: muse-glimmer-${{ matrix.platform }}
          path: expected
      - name: Verify published bytes, provenance and installation
        run: |
          uv pip install pypi-attestations==0.0.31
          python packaging/release.py download expected published --platform '${{ matrix.platform }}'
          python packaging/check_wheel.py --install published/*.whl

  github-release:
    needs: verify-pypi
    if: "!cancelled() && needs.verify-pypi.result == 'success'"
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: expected
      - name: Publish GitHub Release from the verified PyPI wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv pip install pypi-attestations==0.0.31
          python packaging/release.py download expected published
          python packaging/release.py github published
