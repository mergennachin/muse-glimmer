[build-system]
requires = ["setuptools>=77", "wheel>=0.45", "cmake>=3.26,<4", "pyyaml>=6", "torch==2.14.0"]
build-backend = "_build_backend"
backend-path = ["build_backend"]

[project]
name = "muse-glimmer"
version = "0.1.0.dev0"
description = "Serve Muse Glimmer locally"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "transformers>=5.18,<5.19",
  "jinja2>=3.1,<4",
  "huggingface-hub>=1.31,<3",
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "setuptools>=77", "wheel>=0.45", "ruff>=0.9"]

[project.scripts]
muse-glimmer = "muse_glimmer.cli:main"

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["muse_glimmer*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
muse_glimmer = ["_native/*", "_vendor/**/*.jinja", "_vendor/LICENSE", "_vendor/provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
